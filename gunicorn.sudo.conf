User_Alias GROUPONE = tools, tools-deploy
Cmnd_Alias GUNICORN_RESTART = /usr/bin/systemctl restart gunicorn
Cmnd_Alias GUNICORN_STATUS = /bin/systemctl status gunicorn
Cmnd_Alias GUNICORN_START = /bin/systemctl start gunicorn
Cmnd_Alias GUNICORN_STOP = /bin/systemctl stop gunicorn
Cmnd_Alias GUNICORN_RELOAD = /bin/systemctl reload gunicorn

# Allow members of GROUPONE to restart gunicorn
GROUPONE ALL = NOPASSWD: GUNICORN_RESTART